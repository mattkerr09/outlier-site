# Runs the gates in scripts/ without someone being at a terminal to run them.
#
# Every gate in this repo was written because something shipped wrong once, and
# every one of them has only ever run when someone happened to be at the
# keyboard. That is the same shape as the defects they catch: a rule enforced by
# remembering. This makes them run on their own.
#
# WHY deploy_freshness IS SPLIT OFF FROM push. It compares the SERVED bytes
# against HEAD, and GitHub Pages takes a few minutes to rebuild after a push, so
# on a push trigger it fails correctly and uselessly — it would be red on every
# commit for reasons nobody should act on. A gate that is red by design gets
# ignored, and then it is red for a real reason and still ignored. So push runs
# everything else; the schedule runs the full set once the deploy has settled.
name: gates

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly, offset so it never lands on the hour with everything else
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # deploy_freshness reads `git show HEAD:<path>`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gates that read the repo (no network)
        run: |
          set -e
          python3 scripts/liveness_claim_gate.py .
          python3 scripts/offline_proof_gate.py .
          python3 scripts/word_floor_gate.py .
          python3 scripts/no_internal_docs_gate.py .
          python3 scripts/styled_class_gate.py .
          python3 scripts/internal_link_gate.py .
          # meta_gate runs LAST of the offline set: it proves the gates above
          # cannot report a false clean, by running each against an empty tree.
          python3 scripts/figure_provenance_gate.py .
          python3 scripts/meta_gate.py .

      - name: Gates that check live third parties
        run: |
          set -e
          python3 scripts/download_version_gate.py .
          python3 scripts/download_reachable_gate.py .
          python3 scripts/checkout_link_gate.py .

      # Only meaningful once Pages has rebuilt, so it is excluded from push runs.
      - name: Deploy freshness (scheduled and manual only)
        if: github.event_name != 'push'
        run: python3 scripts/deploy_freshness_gate.py

      # seo_lint exits 1 today on 188 pre-existing failures: 184 DUP (the
      # renderer-generated /seo/vs/ and /seo/run/ pages share up to 73% of their
      # body prose — one template with nouns swapped) and 4 THIN. Both are
      # strategy calls, not copy edits: padding a page to clear a word floor is
      # what this linter's own comments warn against, and de-duplicating 50+
      # programmatic pages is a content decision nobody has taken yet.
      #
      # Wiring it in as a blocking step would make this pipeline red on every
      # single run forever, which is the failure the deploy_freshness comment
      # above describes — a check that is red by design gets ignored, and then
      # it is red for a real reason and still ignored.
      #
      # So it gates on GROWTH against today's count. A new duplicate or a newly
      # thinned page fails; the existing 188 do not. Lower the baseline when the
      # backlog is actually reduced — never raise it to make a failure go away.
      #
      # 2026-08-25: lowered 245 -> 188 because the backlog really did shrink. It
      # had been RED every run since 2026-08-24 19:09 — b14377a2 put the same
      # ~40-line email-capture form on 52 pages, seo_lint's hardcoded chrome list
      # did not know that block, so identical furniture was scored as duplicate
      # PROSE and the count jumped 227 -> 573. Two days of hourly failure mail
      # about a feature that works. seo_lint now derives furniture from document
      # frequency instead of a fixed selector list, so the number below measures
      # body prose again. Raising the baseline to 573 would have been the easy
      # move and would have blinded this step to 300-odd real duplicates.
      - name: SEO lint (fails only if the failure count grows)
        run: |
          set -o pipefail
          BASELINE=188
          python3 scripts/seo_lint.py . > /tmp/seo.txt 2>&1 || true
          COUNT=$(grep -cE '^  (THIN|VOICE|DUP)' /tmp/seo.txt || true)
          echo "seo_lint failures: $COUNT (baseline $BASELINE)"
          grep -oE '^  (THIN|VOICE|DUP)' /tmp/seo.txt | sort | uniq -c
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::seo_lint failures rose from $BASELINE to $COUNT"
            diff <(echo) /tmp/seo.txt | grep -E '^> +(THIN|VOICE|DUP)' | head -40
            exit 1
          fi
