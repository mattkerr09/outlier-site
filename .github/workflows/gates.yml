# Runs the gates in scripts/ without someone being at a terminal to run them.
#
# Every gate in this repo was written because something shipped wrong once, and
# every one of them has only ever run when someone happened to be at the
# keyboard. That is the same shape as the defects they catch: a rule enforced by
# remembering. This makes them run on their own.
#
# WHY deploy_freshness IS SPLIT OFF FROM push. It compares the SERVED bytes
# against HEAD, and GitHub Pages takes a few minutes to rebuild after a push, so
# on a push trigger it fails correctly and uselessly — it would be red on every
# commit for reasons nobody should act on. A gate that is red by design gets
# ignored, and then it is red for a real reason and still ignored. So push runs
# everything else; the schedule runs the full set once the deploy has settled.
name: gates

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly, offset so it never lands on the hour with everything else
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # deploy_freshness reads `git show HEAD:<path>`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gates that read the repo (no network)
        run: |
          set -e
          python3 scripts/liveness_claim_gate.py .
          python3 scripts/offline_proof_gate.py .
          python3 scripts/word_floor_gate.py .
          python3 scripts/no_internal_docs_gate.py .
          python3 scripts/styled_class_gate.py .
          python3 scripts/internal_link_gate.py .
          # meta_gate runs LAST of the offline set: it proves the gates above
          # cannot report a false clean, by running each against an empty tree.
          python3 scripts/figure_provenance_gate.py .
          # Wired 2026-09-16. These eight existed and were run by NOTHING — not
          # this workflow, not a sibling script, not a hook. Running them by hand
          # found all eight green, so nothing was hiding behind them; they are
          # wired so that stays true. Each takes under a second (2.2s for the
          # set) and each already REFUSES on an empty tree rather than reporting
          # a false clean, which meta_gate below re-proves on every run.
          #
          # rival_price_in_source_gate is deliberately NOT here: it fetches the
          # live rival set serially at 25s each and takes over two minutes. A
          # slow gate wired carelessly is how a suite stops being run at all.
          python3 scripts/meta_figure_gate.py .
          python3 scripts/pixel_disclosure_gate.py .
          python3 scripts/retired_monthly_gate.py .
          python3 scripts/seat_claim_gate.py .
          python3 scripts/serp_length_gate.py .
          python3 scripts/sitemap_coverage_gate.py .
          # This gate compares models.csv to the app's TIER_DISPLAY_ORDER. The app
          # is not in this checkout, and for a few hours today CI skipped it for
          # that reason — which made its ONLY enforcement a no-op, because CI is
          # the only thing that runs it (no pre-push hook, deploy is a push to
          # Pages). The gate exists because the site once sold a dead tier.
          #
          # It now reads seo/_data/app_tiers.json, a snapshot the app's ship
          # pipeline writes, and refuses unless the version that snapshot was cut
          # from matches the version the site advertises — so a stale copy fails
          # loudly instead of letting the tier list drift. With no app AND no
          # snapshot it exits 1: blocked, never a quiet pass.
          python3 scripts/tier_catalog_sync_gate.py .
          python3 scripts/tier_figure_gate.py .
          # Wired 2026-09-16, ahead of the Product Hunt comparison pages: those
          # pages state rivals' prices, and this is the gate that makes each one
          # cite where it came from. It PASSES today (0.2s, refuses on an empty
          # tree) and is a RATCHET — 14 legacy pages baselined, only NEW ones
          # fail — which is exactly the shape you want before adding pages that
          # quote someone else's money.
          python3 scripts/rival_price_source_gate.py .
          python3 scripts/rival_price_source_gate.py --assert-baseline-not-grown
          # meta_gate runs LAST of the offline set: it proves the gates above
          # cannot report a false clean, by running each against an empty tree.
          python3 scripts/meta_gate.py .

      - name: Gates that check live third parties
        run: |
          set -e
          python3 scripts/download_version_gate.py .
          python3 scripts/download_reachable_gate.py .
          python3 scripts/checkout_link_gate.py .
          python3 scripts/seat_count_gate.py .
          python3 scripts/checkout_price_gate.py --break-test
          python3 scripts/checkout_price_gate.py .
          # Wired 2026-09-16, after sitting unwired since it was written. Its
          # sibling above asks whether a page pricing someone else CITES a
          # vendor URL; this one asks whether the PRICE is in what it cites —
          # citation presence and citation content are different properties and
          # only the weaker one was gated. It reported 51 claims and was held
          # back for it; four defects in the gate itself turned out to be the
          # cause. It corroborated a rival's price against the byline link, it
          # matched substrings so $20 was satisfied by $200, it read raw HTML so
          # minified bundle tokens counted as prices, and it called a source it
          # could not read a source that disagreed.
          #
          # Site-wide today: 0 unsourced across 60 pages. The ~112 findings it
          # still reports are vendors that render prices in JavaScript, which it
          # summarises rather than lists and does NOT fail on — fetching can
          # neither confirm nor deny those, and failing them would pressure
          # someone into deleting a true statement about another company.
          #
          # It self-checks (--self-check proves it fails on an absent price and
          # passes on a present one) and takes ~3 minutes, which is network wait
          # across ~50 hosts at 8 concurrent fetches, not compute.
          python3 scripts/rival_price_in_source_gate.py --self-check
          python3 scripts/rival_price_in_source_gate.py .

      # Only meaningful once Pages has rebuilt, so it is excluded from push runs.
      - name: Deploy freshness (scheduled and manual only)
        if: github.event_name != 'push'
        run: python3 scripts/deploy_freshness_gate.py

      - name: Visible dateline honesty
        run: python3 scripts/visible_dateline_gate.py

      # seo_lint exits 1 today on 188 pre-existing failures: 184 DUP (the
      # renderer-generated /seo/vs/ and /seo/run/ pages share up to 73% of their
      # body prose — one template with nouns swapped) and 4 THIN. Both are
      # strategy calls, not copy edits: padding a page to clear a word floor is
      # what this linter's own comments warn against, and de-duplicating 50+
      # programmatic pages is a content decision nobody has taken yet.
      #
      # Wiring it in as a blocking step would make this pipeline red on every
      # single run forever, which is the failure the deploy_freshness comment
      # above describes — a check that is red by design gets ignored, and then
      # it is red for a real reason and still ignored.
      #
      # So it gates on GROWTH against today's count. A new duplicate or a newly
      # thinned page fails; the existing 188 do not. Lower the baseline when the
      # backlog is actually reduced — never raise it to make a failure go away.
      #
      # 2026-08-25: lowered 245 -> 188 because the backlog really did shrink. It
      # had been RED every run since 2026-08-24 19:09 — b14377a2 put the same
      # ~40-line email-capture form on 52 pages, seo_lint's hardcoded chrome list
      # did not know that block, so identical furniture was scored as duplicate
      # PROSE and the count jumped 227 -> 573. Two days of hourly failure mail
      # about a feature that works. seo_lint now derives furniture from document
      # frequency instead of a fixed selector list, so the number below measures
      # body prose again. Raising the baseline to 573 would have been the easy
      # move and would have blinded this step to 300-odd real duplicates.
      # Duplicate INTENT, which the shingle check above is structurally blind to.
      # It reports and does not block: measured at about one useful finding in five
      # (see the module docstring), and a check wrong three times in five must not
      # be able to stop a deploy. It DOES fail if its own classifier stops
      # classifying, because a broken classifier prints zero warnings and a clean
      # site prints zero warnings, and those must not look the same in a log.
      - name: Duplicate intent (warns; fails only if the classifier breaks)
        run: python3 scripts/intent_warn.py .

      - name: SEO lint (fails only if the failure count grows)
        run: |
          set -o pipefail
          # 188 was the count on the day the ratchet was set. It is 171 today, and a
          # ratchet seventeen points above reality is seventeen new duplicates that
          # can appear while this step stays green — the slack IS the hole. Lowered
          # to what the site actually produces, 2026-09-15.
          BASELINE=171
          python3 scripts/seo_lint.py . > /tmp/seo.txt 2>&1 || true
          COUNT=$(grep -cE '^  (THIN|VOICE|DUP)' /tmp/seo.txt || true)
          echo "seo_lint failures: $COUNT (baseline $BASELINE)"
          grep -oE '^  (THIN|VOICE|DUP)' /tmp/seo.txt | sort | uniq -c
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::seo_lint failures rose from $BASELINE to $COUNT"
            diff <(echo) /tmp/seo.txt | grep -E '^> +(THIN|VOICE|DUP)' | head -40
            exit 1
          fi
