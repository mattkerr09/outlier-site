name: pages

# Publishes ONLY the site's files to GitHub Pages (Bing clean-up step 3, 2026-11-07). Before this, Pages built the whole
# repository (legacy build with .nojekyll), so /scripts/, /_seo_build/, /seo/_data/ and README.md were public.
#
# WHY workflow_run AND NOT push: gates.yml fast-forwards main with GITHUB_TOKEN, and a push made with GITHUB_TOKEN never
# triggers another workflow. So this runs when gates.yml completes successfully on next, and deploys what main now holds.
#
# SAFE BEFORE THE FLIP: while the repository's Pages build_type is still "legacy", the deploy step is skipped with a notice and
# the run stays green. The CEO flips build_type to "workflow" (gh api) only after this is merged and green; that flip is the
# one risky moment, and it is checked live straight away.

on:
  workflow_run:
    workflows: [gates]
    types: [completed]
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.mode.outputs.build_type }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
      - name: Check out main (what the gates just promoted)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the Pages build type
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Pages build_type: $bt"

      - name: Assemble the public site (everything except build tooling and internal files)
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '.gitignore' \
            --exclude 'scripts/' --exclude '_seo_build/' --exclude 'seo/_data/' \
            --exclude 'README.md' --exclude '_site/' \
            --exclude '*.bak' --exclude '*.bak_*' --exclude '.DS_Store'
          # The artifact must hold the site and nothing internal. A check that fails on its own bug: count both sides.
          for p in scripts _seo_build seo/_data README.md .github; do
            if [ -e "_site/$p" ]; then echo "::error::internal path in the artifact: $p"; exit 1; fi
          done
          for p in index.html 404.html sitemap.xml robots.txt CNAME llms.txt privacy.html terms.html thank-you.html \
                   about/index.html developers/index.html ai-assistants/index.html \
                   67223b34aed54ecb802e8ffcbacb9ec2.txt 39a190ab445d73f57af4ed54a6992c18.txt; do
            if [ ! -e "_site/$p" ]; then echo "::error::site file missing from the artifact: $p"; exit 1; fi
          done
          pages=$(find _site -name '*.html' | wc -l | tr -d ' ')
          echo "artifact: $pages HTML files, $(du -sh _site | cut -f1)"
          [ "$pages" -ge 200 ] || { echo "::error::only $pages HTML files: the site is incomplete"; exit 1; }

      - name: Upload the artifact
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Not deployed (Pages is still on the legacy build)
        if: steps.mode.outputs.build_type != 'workflow'
        run: echo "::notice::Pages build_type is '${{ steps.mode.outputs.build_type }}', not 'workflow'. The artifact was built and checked, and nothing was deployed. Pages keeps serving its legacy build of main."

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2026-11-20 (Outlier session; CEO's top priority: Bing showing outlier.host again). RULES 60 says Bing and IndexNow get the
  # changed URLs the same day as any price, name or page change. Until now every IndexNow send for outlier.host was done by
  # hand. This sends ONLY the indexable pages (in sitemap.xml) changed between the previous successful Pages deployment and
  # this one, plus llms.txt, plus pages deleted from the sitemap. It first proves the live site serves the key file. The key
  # is public by design (it is served at the site root). A failed send turns this run red; the deploy itself is already done.
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check out what was deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Tell IndexNow (Bing, Yandex, Naver, Seznam) which pages this deploy changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TO: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          from=""
          # Newest first. Skip this run's own deployment, then take the newest earlier one that succeeded. GitHub marks a
          # successful deployment "inactive" once a newer one succeeds (read 2026-11-20: b8b4d1521 success, f5a7902b2 and
          # every older one inactive), so both states mean "was deployed"; failure/error/pending do not.
          for row in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id):\(.sha)"'); do
            id=${row%%:*}; sha=${row#*:}
            if [ "$sha" = "$TO" ] || [ "$sha" = "$GITHUB_SHA" ]; then continue; fi
            state=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // ""')
            if [ "$state" = "success" ] || [ "$state" = "inactive" ]; then from=$sha; break; fi
          done
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "::warning::no earlier successful Pages deployment found; nothing sent to IndexNow"
            exit 0
          fi
          echo "IndexNow range: $from..$TO"
          python3 scripts/indexnow_after_deploy.py --host outlier.host --repo . --from "$from" --to "$TO"
